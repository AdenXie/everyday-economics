name: Check Everyday Economics

# The site and its /api/chat function are hosted on Vercel, which builds and deploys
# every push to main (see vercel.json). This workflow only runs the checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run verify
      - run: npm test
      - run: npm run build
